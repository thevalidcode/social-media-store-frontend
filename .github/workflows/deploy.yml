name: 🚀 Deploy Next.js to VPS (Pre-Built)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: nextjs-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
            node_modules
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app (export static)
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          source: |
            out/* 
            out/.* 
          target: "~/social-media-store/frontend/"
          overwrite: true


      - name: Serve static files via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            # Stop old PM2 process if exists
            pm2 describe social-media-store-frontend > /dev/null 2>&1 && pm2 delete social-media-store-frontend || true

            # Start serving static files
            command -v serve >/dev/null 2>&1 || npm install -g serve
            PORT=4340 NODE_ENV=production pm2 start serve --name social-media-store-frontend -- ~/social-media-store/frontend -p 4340
            pm2 save

            echo "✅ Deployment completed! App running on port 4340"
