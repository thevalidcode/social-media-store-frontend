name: 🚀 Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: nextjs-deploy
      cancel-in-progress: true

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2022
          script: |
            set -e

            echo "Deploying Next.js app..."

            # Prevent race conditions on rapid pushes
            exec 9>/tmp/social-media-store-frontend.lock
            flock -n 9 || exit 0

            cd ~ || exit 1

            # Ensure base directory exists
            mkdir -p social-media-store

            # Clone repo if it does not exist
            if [ ! -d "social-media-store/frontend/.git" ]; then
              echo "Repository not found. Cloning..."
              git clone https://github.com/thevalidcode/social-media-store-frontend.git social-media-store/frontend
            else
              echo "Repository found. Updating..."
            fi

            cd social-media-store/frontend || exit 1

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            npm ci --omit=dev
            npm run build

            PORT=4340 pm2 describe social-media-store-frontend > /dev/null \
              && PORT=4340 pm2 restart social-media-store-frontend --update-env \
              || PORT=4340 pm2 start npm --name social-media-store-frontend -- start

            pm2 save

            echo "Deployment completed!"
